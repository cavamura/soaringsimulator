    <h1>Ajuda / Manual</h1>
    <p class="small">IFR Training Simulator - Navega&ccedil;&atilde;o VOR e Piloto Autom&aacute;tico</p>

    <h2>Objetivo</h2>
    <p>
      Dominar a navega&ccedil;&atilde;o VOR (VHF Omnidirectional Range), sintonizar frequ&ecirc;ncias de r&aacute;dio, interpretar o RMI (Radio Magnetic Indicator)
      e usar o piloto autom&aacute;tico para manter proas selecionadas. Um simulador voltado ao treinamento de navega&ccedil;&atilde;o a&eacute;rea.
    </p>

    <h2>Como o Simulador Funciona</h2>
    <div class="card">
      <p><strong>Se&ccedil;&atilde;o A (Mapa):</strong> vista superior da aeronave, trajet&oacute;ria, e esta&ccedil;&otilde;es VOR (s&iacute;mbolos hexagonais com frequ&ecirc;ncia).</p>
      <p><strong>Se&ccedil;&atilde;o B (Cockpit):</strong> horizonte artificial com indica&ccedil;&atilde;o de atitude e rumo (heading).</p>
      <p><strong>Se&ccedil;&atilde;o C (Painel IFR):</strong> RMI (Radio Magnetic Indicator), seletor de proa (heading bug), NAV/DME e piloto autom&aacute;tico.</p>
      <p>
        <strong>VORs (Esta&ccedil;&otilde;es):</strong> At&eacute; 3 esta&ccedil;&otilde;es VOR aparecem aleatoriamente no mapa. Cada VOR possui uma frequ&ecirc;ncia VHF NAV e est&aacute; identificado
        com seu nome (VOR A, VOR B, VOR C). Selecione uma esta&ccedil;&atilde;o no painel NAV para navegar at&eacute; ela.
      </p>
      <p>
        <strong>RMI:</strong> Mostra o rumo magn&eacute;tico atual (lubber line em amarelo) e, quando uma esta&ccedil;&atilde;o VOR est&aacute; sintonizada,
        exibe um ponteiro vermelho indicando a dire&ccedil;&atilde;o (bearing) at&eacute; a esta&ccedil;&atilde;o.
      </p>
      <p>
        <strong>NAV/DME:</strong> Sintonize a frequ&ecirc;ncia de um VOR usando o campo NAV e clique em "Sintonizar". O painel exibe
        o DME (distance to station) em milhas n&aacute;uticas.
      </p>
      <p>
        <strong>Piloto Autom&aacute;tico:</strong> Ligue o AP (Autopilot) e configure uma proa no indicador de dire&ccedil;&atilde;o. A aeronave
        automaticamente curva e se estabiliza na proa selecionada.
      </p>
    </div>

    <h2>Guia de Opera&ccedil;&atilde;o</h2>
    ul, ol {
      margin: 8px 0 12px;
      <li>A miss&atilde;o gera at&eacute; 3 esta&ccedil;&otilde;es VOR aleatoriamente na regi&atilde;o do mapa.</li>
      <li>Para navegar para uma esta&ccedil;&atilde;o VOR:</li>
    }
    li { margin: 4px 0; }
      <li>Localize a frequ&ecirc;ncia da esta&ccedil;&atilde;o no mapa (exibida no s&iacute;mbolo hexagonal).</li>
      <li>Digite a frequ&ecirc;ncia no campo <strong>NAV</strong> e clique em <strong>Sintonizar</strong>.</li>
      <li>Observe o RMI: o ponteiro vermelho aponta para a esta&ccedil;&atilde;o.</li>
      <li>O painel <strong>DME</strong> mostra a dist&acirc;ncia at&eacute; a esta&ccedil;&atilde;o em milhas n&aacute;uticas.</li>
    }
    .small { color: #9bb3d1; font-size: 13px; }
    a { color: #8fd4ff; }
      <li>Usando o Piloto Autom&aacute;tico:</li>
      border: 1px solid #356083;
      background: rgba(15, 35, 55, 0.8);
      <li>Ligue o <strong>AP (Autopilot)</strong> clicando no bot&atilde;o "AP OFF" para mudar para "AP ON".</li>
      <li>Digite a proa desejada no campo <strong>Indicador de dire&ccedil;&atilde;o / Proa</strong> e clique em <strong>Setar</strong>.</li>
      <li>A aeronave automaticamente curva at&eacute; estabilizar na proa selecionada.</li>
      <li>Com AP desligado, use os bot&otilde;es <strong>&larr; / &rarr;</strong> para pilotar manualmente.</li>
</head>
<body>
  <div class="wrap">
      <li>Controles Manuais (AP desligado):</li>
        Em cerca de <strong>50% das t&eacute;rmicas</strong>, aparecem indicadores visuais sobre o c&iacute;rculo:
     <ul>
      <li><strong>&larr; / &rarr;</strong> Aumenta ou diminui o &acirc;ngulo de curva (bank).</li>
      <li><strong>&uarr; / &darr;</strong> Aumenta ou reduz a velocidade da aeronave.</li>
      <li><strong>P</strong> Pausa e retoma a simula&ccedil;&atilde;o.</li>
      <li><strong>H</strong> Abre este manual de ajuda.</li>
    </ul>

    <ol start="5">
      <li>Configura&ccedil;&atilde;o:</li>
    </ol>
    <ul>
      <li>Painel <strong>"Configura&ccedil;&atilde;o da Simula&ccedil;&atilde;o"</strong> permite ativar <strong>Google Maps</strong> como fundo do mapa.</li>
      <li>Op&ccedil;&atilde;o <strong>"Mostrar trajet&oacute;ria"</strong> desenha o rastro da aeronave no mapa.</li>
      <li>URL de log opcional para registrar dados de voo em servidor remoto ou Google Apps Script.</li>
    </ul>

    <h2>Dicas de Treinamento</h2>
        <strong>nuvens c&uacute;mulus</strong> (vista superior) ou um grupo de <strong>3 urubus</strong>
      <li>Comece sintonizando uma esta&ccedil;&atilde;o pr&oacute;xima para familiarizar-se com o RMI e DME.</li>
      <li>Pratique o uso do piloto autom&aacute;tico mantendo uma proa constante enquanto se aproxima de uma esta&ccedil;&atilde;o.</li>
      <li>Combine navega&ccedil;&atilde;o manual com AP: solte o AP para ajustes finos perto da esta&ccedil;&atilde;o.</li>
      <li>Acompanhe a dist&acirc;ncia DME conforme voc&ecirc; se aproxima da esta&ccedil;&atilde;o (deve diminuir progressivamente).</li>
      <li>Experimente diferentes frequ&ecirc;ncias VOR para treinar m&uacute;ltiplas abordagens.</li>
    <h2>Manual de Uso</h2>
    <ol>
      <li>Abra o simulador no navegador.</li>
      <li>Use os controles para pilotar:</li>
    </ol>
    <ul>
      <li><strong>&larr;</strong> Curva 5&deg; para a esquerda.</li>
      <li><strong>&rarr;</strong> Curva 5&deg; para a direita.</li>
      <li><strong>&uarr;</strong> Aumenta a velocidade.</li>
      <li><strong>&darr;</strong> Reduz a velocidade.</li>
      <li><strong>P</strong> Pausa/retoma simula&ccedil;&atilde;o.</li>
    </ul>

    <ol start="3">
      <li>Observe os instrumentos:</li>
    </ol>
    <ul>
      <li><strong>Veloc&iacute;metro:</strong> velocidade atual.</li>
      <li><strong>Alt&iacute;metro:</strong> altitude da aeronave em metros.</li>
      <li><strong>Vari&ocirc;metro:</strong> taxa de subida/descida (m/s).</li>
    </ul>

    <ol start="4">
      <li>
        Em <strong>Configura&ccedil;&atilde;o da simula&ccedil;&atilde;o</strong>, ajuste altitude inicial, n&uacute;mero de t&eacute;rmicas,
        <strong>raz&atilde;o de descida fora de t&eacute;rmica (m/s)</strong>,
        <strong>intervalo de recria&ccedil;&atilde;o das t&eacute;rmicas (s)</strong>, visualiza&ccedil;&atilde;o de trilha,
        mapa Google e URL de log (Apps Script).
      </li>
      <li>
        A raz&atilde;o de descida define a perda de altitude quando a aeronave est&aacute; fora das t&eacute;rmicas.
        Valor maior = perda mais r&aacute;pida de altitude. Valor menor = planeio mais eficiente.
      </li>
      <li>
        Faixa recomendada: <strong>0,1 a 10,0 m/s</strong>. O valor padr&atilde;o &eacute; <strong>1,0 m/s</strong>.
      </li>
      <li>
        O intervalo de recria&ccedil;&atilde;o define de quantos em quantos segundos as t&eacute;rmicas mudam de lugar.
        Valor padr&atilde;o: <strong>120 s</strong> (2 minutos). Faixa dispon&iacute;vel: <strong>10 a 600 s</strong>.
      </li>
      <li>
        Clique em <strong>Aplicar</strong> para usar as configura&ccedil;&otilde;es atuais e em <strong>Reiniciar</strong>
        para come&ccedil;ar uma nova sess&atilde;o.
      </li>
      <li>Se a altitude chegar a 0 m, o voo termina.</li>
    </ol>

    <h2>Dicas R&aacute;pidas</h2>
    <ul>
      <li>Mantenha curvas suaves para n&atilde;o perder efici&ecirc;ncia.</li>
      <li>Procure e permane&ccedil;a nas t&eacute;rmicas para recuperar altitude.</li>
      <li>Nuvens c&uacute;mulus e urubus em c&iacute;rculo s&atilde;o pistas visuais de t&eacute;rmica na Se&ccedil;&atilde;o A.</li>
      <li>Controle a velocidade para evitar extremos de voo lento ou r&aacute;pido demais.</li>
    </ul>
